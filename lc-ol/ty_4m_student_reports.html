function avgScore(val) {
  if (val === null || val === undefined) return null;
  if (Array.isArray(val)) {
    const nums = val.filter(v => v !== null && v !== undefined);
    return nums.length ? nums.reduce((a,b) => a+b, 0) / nums.length : null;
  }
  return val;
}

function getBarColor(pct) {
  if (pct >= 75) return '#1D9E75';
  if (pct >= 50) return '#378ADD';
  if (pct >= 25) return '#EF9F27';
  return '#E24B4A';
}

function initials(name) {
  return name.slice(0,2).toUpperCase();
}

function calcOverall(s) {
  const entries = Object.entries(s.scores).map(([k,v]) => avgScore(v)).filter(v => v !== null);
  if (!entries.length) return null;
  return entries.reduce((a,b) => a+b, 0) / entries.length;
}

let currentIdx = 0;

function render(idx) {
  const s = students[idx];
  const overall = calcOverall(s);
  const subjects = Object.entries(s.scores)
    .map(([name, val]) => ({ name, avg: avgScore(val), max: MAX_CREDITS[name] || 10 }))
    .filter(e => e.avg !== null)
    .sort((a,b) => (b.avg/b.max) - (a.avg/a.max));

  const scored = subjects.filter(e => e.avg !== null);
  const totalEarned = scored.reduce((a,e) => a + e.avg, 0);
  const totalPossible = scored.reduce((a,e) => a + e.max, 0);

  document.getElementById('reportArea').innerHTML = `
    <div class="report-header">
      <div class="avatar">${initials(s.name)}</div>
      <div>
        <div class="student-name">${s.name}</div>
        <div class="student-class">TY 4M — Individual Credit Report</div>
      </div>
    </div>
    <div class="summary-grid">
      <div class="stat-card">
        <div class="stat-label">Subjects recorded</div>
        <div class="stat-value">${scored.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Credits earned</div>
        <div class="stat-value">${totalEarned.toFixed(1)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg score</div>
        <div class="stat-value" style="color:${getBarColor(overall / 10 * 100)}">${overall !== null ? overall.toFixed(1) : '—'}<span style="font-size:13px;color:var(--color-text-secondary)">/10</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Participation</div>
        <div class="stat-value" style="font-size:17px">${s.participation}</div>
      </div>
    </div>
    <div class="subjects-section">
      <div class="section-title">Subject breakdown</div>
      ${subjects.length === 0 ? '<p class="no-data">No scores recorded.</p>' : subjects.map(e => {
        const pct = Math.round((e.avg / e.max) * 100);
        const col = getBarColor(pct);
        return `<div class="subject-row">
          <span class="subject-name">${e.name}</span>
          <div class="bar-wrap"><div class="bar" style="width:${pct}%;background:${col}"></div></div>
          <span class="score-label" style="color:${col}">${e.avg % 1 === 0 ? e.avg : e.avg.toFixed(1)}<span style="font-size:11px;color:var(--color-text-tertiary)">/${e.max}</span></span>
        </div>`;
      }).join('')}
    </div>
  `;
}

const sel = document.getElementById('studentSelect');
students.forEach((s, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = s.name;
  sel.appendChild(opt);
});

sel.addEventListener('change', () => { currentIdx = +sel.value; render(currentIdx); });
document.getElementById('prevBtn').addEventListener('click', () => {
  currentIdx = (currentIdx - 1 + students.length) % students.length;
  sel.value = currentIdx; render(currentIdx);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currentIdx = (currentIdx + 1) % students.length;
  sel.value = currentIdx; render(currentIdx);
});
